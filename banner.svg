<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0d1117" />
            <stop offset="100%" stop-color="#161b22" />
        </linearGradient>
        
        <!-- Terminal Window Shadow -->
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.3"/>
        </filter>

        <style>
            .header {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                font-size: 24px;
                font-weight: 700;
                fill: #c9d1d9;
            }
            
            .name {
                fill: #58a6ff;
                font-size: 36px;
                font-weight: 800;
            }
            
            .terminal-text {
                font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                font-size: 16px;
                fill: #8b949e;
            }
            
            .prompt { fill: #3fb950; }
            .command { fill: #c9d1d9; font-weight: bold; }
            
            /* Typing animation styles */
            .typing {
                animation: type 4s steps(40, end) infinite, blink .75s step-end infinite;
                white-space: nowrap;
                overflow: hidden;
                border-right: 2px solid #58a6ff;
                display: inline-block;
            }
            
            @keyframes type {
                0%, 20% { width: 0; }
                50%, 70% { width: 340px; }
                90%, 100% { width: 0; }
            }
            
            @keyframes blink {
                from, to { border-color: transparent }
                50% { border-color: #58a6ff; }
            }
        </style>
    </defs>

    <!-- Background -->
    <rect width="800" height="250" fill="url(#bgGrad)" rx="10"/>

    <!-- Terminal Window Container -->
    <g transform="translate(40, 30)" filter="url(#shadow)">
        <!-- Terminal Top Bar -->
        <rect width="720" height="30" fill="#21262d" rx="6" ry="6" />
        <rect width="720" height="15" y="15" fill="#21262d" />
        
        <!-- Window Controls -->
        <circle cx="20" cy="15" r="6" fill="#ff5f56" />
        <circle cx="40" cy="15" r="6" fill="#ffbd2e" />
        <circle cx="60" cy="15" r="6" fill="#27c93f" />
        
        <!-- Terminal Title -->
        <text x="360" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">shreyash@macbook:~</text>

        <!-- Terminal Body -->
        <rect y="30" width="720" height="140" fill="#0d1117" rx="0" ry="0"/>
        
        <!-- Bottom rounded corners for terminal body -->
        <path d="M0,160 L0,164 Q0,170 6,170 L714,170 Q720,170 720,164 L720,160 Z" fill="#0d1117"/>

        <!-- Terminal Content -->
        <g transform="translate(20, 65)">
            <text class="terminal-text">
                <tspan class="prompt">➜</tspan> 
                <tspan class="command" x="25">whoami</tspan>
            </text>
            
            <text class="header" y="40">Hi, I'm <tspan class="name">Shreyash Atre</tspan> 👋</text>
            
            <!-- Animated role typing -->
            <g transform="translate(0, 75)">
                <text class="terminal-text" y="0">
                    <tspan class="prompt">➜</tspan> 
                    <tspan class="command" x="25">cat</tspan> roles.txt
                </text>
                
                <text x="25" y="25" class="terminal-text">
                    [ <tspan fill="#d2a8ff">"Software Engineer"</tspan>, <tspan fill="#a5d6ff">"Backend Developer"</tspan>, <tspan fill="#7ee787">"Full-Stack"</tspan> ]
                </text>
            </g>
        </g>
    </g>
</svg>
