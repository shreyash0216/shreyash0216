<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 520" width="300" height="520">
<defs>
  <linearGradient id="lyStrap" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#1d4ed8"/>
    <stop offset="50%" stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#1d4ed8"/>
  </linearGradient>
  <linearGradient id="lyCard" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#1a1b27"/>
    <stop offset="100%" stop-color="#0b1120"/>
  </linearGradient>
  <linearGradient id="lyMetal" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#e5e7eb"/>
    <stop offset="30%" stop-color="#9ca3af"/>
    <stop offset="70%" stop-color="#d1d5db"/>
    <stop offset="100%" stop-color="#6b7280"/>
  </linearGradient>
  <linearGradient id="lyRing" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#06b6d4"/>
    <stop offset="100%" stop-color="#2563eb"/>
  </linearGradient>
  <linearGradient id="lyShine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#fff" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="lyShadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/></filter>
  <filter id="lyGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="lyAvatarClip"><circle cx="150" cy="290" r="38"/></clipPath>
  <clipPath id="lyCardClip"><rect x="75" y="230" width="150" height="270" rx="12"/></clipPath>
</defs>

<!-- Drop animation wrapper -->
<g>
  <animateTransform attributeName="transform" type="translate" from="0 -250" to="0 0" dur="0.6s" fill="freeze"/>

  <!-- Damped swing wrapper -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 150 0;14 150 0;-10 150 0;7 150 0;-4 150 0;2.5 150 0;-1.2 150 0;0 150 0"
      keyTimes="0;0.12;0.25;0.38;0.5;0.65;0.8;1"
      dur="3.5s" begin="0.6s" fill="freeze"/>

    <!-- Gentle continuous sway wrapper -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 150 0;-1.2 150 0;1.2 150 0;0 150 0"
        dur="5s" begin="4.1s" repeatCount="indefinite"/>

      <!-- LANYARD STRAP -->
      <rect x="140" y="-10" width="20" height="200" fill="url(#lyStrap)" rx="2"/>
      <!-- Strap text -->
      <g transform="translate(142,20) rotate(90)" opacity="0.5">
        <text x="0" y="6" font-family="'Segoe UI',Ubuntu,sans-serif" font-weight="700" font-size="7" fill="#fff" letter-spacing="1">SHREYASH • ENGINEER •</text>
      </g>
      <g transform="translate(142,70) rotate(90)" opacity="0.5">
        <text x="0" y="6" font-family="'Segoe UI',Ubuntu,sans-serif" font-weight="700" font-size="7" fill="#fff" letter-spacing="1">SHREYASH • ENGINEER •</text>
      </g>
      <g transform="translate(142,120) rotate(90)" opacity="0.5">
        <text x="0" y="6" font-family="'Segoe UI',Ubuntu,sans-serif" font-weight="700" font-size="7" fill="#fff" letter-spacing="1">SHREYASH • ENGINEER •</text>
      </g>
      <g transform="translate(142,165) rotate(90)" opacity="0.5">
        <text x="0" y="6" font-family="'Segoe UI',Ubuntu,sans-serif" font-weight="700" font-size="7" fill="#fff" letter-spacing="1">SHREYASH •</text>
      </g>

      <!-- METAL CLASP -->
      <rect x="135" y="185" width="30" height="20" rx="3" fill="url(#lyMetal)" stroke="#9ca3af" stroke-width="0.5"/>
      <rect x="141" y="188" width="18" height="6" rx="2" fill="#6b7280"/>

      <!-- METAL RING -->
      <circle cx="150" cy="218" r="12" fill="none" stroke="url(#lyMetal)" stroke-width="3"/>
      <circle cx="150" cy="218" r="9" fill="none" stroke="#4b5563" stroke-width="1"/>

      <!-- ID CARD -->
      <g filter="url(#lyShadow)">
        <rect x="75" y="230" width="150" height="270" rx="12" fill="url(#lyCard)" stroke="#374151" stroke-width="1"/>
        <!-- Glass overlay -->
        <rect x="75" y="230" width="150" height="270" rx="12" fill="#fff" fill-opacity="0.02"/>
        <!-- Top accent -->
        <rect x="75" y="230" width="150" height="4" rx="2" fill="url(#lyRing)" opacity="0.8"/>

        <!-- Holographic security lines -->
        <rect x="80" y="240" width="140" height="8" fill="#3b82f6" opacity="0.03" rx="2"/>
        <line x1="80" y1="254" x2="220" y2="254" stroke="#60a5fa" stroke-width="0.5" opacity="0.05"/>
        <line x1="80" y1="258" x2="220" y2="258" stroke="#06b6d4" stroke-width="0.5" opacity="0.05"/>

        <!-- Avatar ring glow -->
        <circle cx="150" cy="290" r="42" fill="none" stroke="url(#lyRing)" stroke-width="3" filter="url(#lyGlow)">
          <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
        </circle>

        <!-- Avatar face -->
        <g clip-path="url(#lyAvatarClip)">
          <rect x="112" y="252" width="76" height="76" rx="38" fill="#0a1628"/>
          <image x="112" y="252" width="76" height="76" href="https://avatars.githubusercontent.com/shreyash0216" preserveAspectRatio="xMidYMid slice"/>
        </g>

        <!-- Card content (fades in after swing) -->
        <g opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2s" fill="freeze"/>

          <text x="150" y="350" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif" font-weight="700" font-size="16" fill="#ffffff">Shreyash Atre</text>
          <text x="150" y="370" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="11" fill="#60a5fa">Backend + Full-Stack</text>
          <text x="150" y="390" text-anchor="middle" font-family="'Cascadia Code','Fira Code',monospace" font-size="10" fill="#d1d5db">@shreyash0216</text>
          <text x="150" y="410" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="10" fill="#bfc6d0">📍 Pune, India</text>

          <line x1="95" y1="420" x2="205" y2="420" stroke="#374151" stroke-width="1"/>

          <!-- Barcode -->
          <g transform="translate(100,430)">
            <rect x="0" y="0" width="2" height="25" fill="#6b7280"/><rect x="4" y="0" width="1" height="25" fill="#6b7280"/>
            <rect x="7" y="0" width="3" height="25" fill="#6b7280"/><rect x="12" y="0" width="1" height="25" fill="#6b7280"/>
            <rect x="15" y="0" width="2" height="25" fill="#6b7280"/><rect x="19" y="0" width="1" height="25" fill="#6b7280"/>
            <rect x="22" y="0" width="3" height="25" fill="#6b7280"/><rect x="27" y="0" width="1" height="25" fill="#6b7280"/>
            <rect x="30" y="0" width="2" height="25" fill="#6b7280"/><rect x="34" y="0" width="1" height="25" fill="#6b7280"/>
            <rect x="37" y="0" width="3" height="25" fill="#6b7280"/><rect x="42" y="0" width="2" height="25" fill="#6b7280"/>
            <rect x="46" y="0" width="1" height="25" fill="#6b7280"/><rect x="49" y="0" width="2" height="25" fill="#6b7280"/>
            <rect x="53" y="0" width="3" height="25" fill="#6b7280"/><rect x="58" y="0" width="1" height="25" fill="#6b7280"/>
            <rect x="61" y="0" width="2" height="25" fill="#6b7280"/><rect x="65" y="0" width="1" height="25" fill="#6b7280"/>
            <rect x="68" y="0" width="3" height="25" fill="#6b7280"/><rect x="73" y="0" width="1" height="25" fill="#6b7280"/>
            <rect x="76" y="0" width="2" height="25" fill="#6b7280"/><rect x="80" y="0" width="1" height="25" fill="#6b7280"/>
            <rect x="83" y="0" width="3" height="25" fill="#6b7280"/><rect x="88" y="0" width="1" height="25" fill="#6b7280"/>
            <rect x="91" y="0" width="2" height="25" fill="#6b7280"/><rect x="95" y="0" width="5" height="25" fill="#6b7280"/>
            <text x="50" y="35" text-anchor="middle" font-family="'Cascadia Code',monospace" font-size="7" fill="#6b7280">ID: SHREYASH-0216</text>
          </g>

          <text x="150" y="492" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="6" fill="#60a5fa" opacity="0.5">VERIFIED DEVELOPER</text>
        </g>

        <!-- Holographic shine sweep -->
        <g clip-path="url(#lyCardClip)">
          <rect x="-80" y="230" width="60" height="270" fill="url(#lyShine)">
            <animate attributeName="x" from="-80" to="230" dur="4s" begin="3s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
    </g>
  </g>
</g>
</svg>
